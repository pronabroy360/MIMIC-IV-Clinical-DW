[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-iv-clinical-data-warehouse"
version = "0.1.0"
description = "Reproducible DuckDB clinical data warehouse and aggregate query layer for MIMIC-IV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pronab Chandra Roy" }]
dependencies = [
  "duckdb>=0.10.0",
  "fastapi>=0.110.0",
  "pandas>=2.0.0",
  "plotly>=5.18.0",
  "pydantic>=2.5.0",
  "pyyaml>=6.0.1",
  "streamlit>=1.31.0",
  "typer>=0.9.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
ml = ["scikit-learn>=1.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
